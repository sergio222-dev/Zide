[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.17"
license = "Apache-2.0"
publish = false

# Synchronized horizontal scroll for split diffs, until gpui-kit releases it.
[patch.crates-io]
gpui-base = { git = "https://github.com/sergio222-dev/gpui-kit", branch = "feat/diff-split-scroll" }
gpui-component = { git = "https://github.com/sergio222-dev/gpui-kit", branch = "feat/diff-split-scroll" }
gpui-component-macros = { git = "https://github.com/sergio222-dev/gpui-kit", branch = "feat/diff-split-scroll" }
gpui-kit = { git = "https://github.com/sergio222-dev/gpui-kit", branch = "feat/diff-split-scroll" }
gpui-kit-assets = { git = "https://github.com/sergio222-dev/gpui-kit", branch = "feat/diff-split-scroll" }
